<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0b">
  <meta name="robots" content="noindex, nofollow">
  <title>Сайт временно недоступен</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0c0b; --fg: #eeece6; --muted: #999a92; --line: rgba(238,236,230,.15); --accent: #c98b9c; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(201,139,156,.075), transparent 36%),
        linear-gradient(145deg, #101110 0%, var(--bg) 58%, #121211 100%);
      color: var(--fg); font-family: Georgia, 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }
    .frame { width: min(100% - 40px, 720px); text-align: center; padding: 64px 0; animation: appear 1.1s ease-out both; }
    .brand { font-size: clamp(27px, 4vw, 36px); letter-spacing: .025em; font-weight: 400; margin: 0; }
    .rule { width: 44px; height: 1px; background: var(--accent); margin: 34px auto 32px; opacity: .85; }
    .status { color: var(--muted); font: 10px/1.5 Arial, sans-serif; letter-spacing: .24em; text-transform: uppercase; margin: 0 0 22px; }
    h1 { font-size: clamp(36px, 6vw, 58px); font-weight: 400; line-height: 1.05; letter-spacing: -.035em; margin: 0; }
    .note { font: 13px/1.9 Arial, sans-serif; color: #a7a79f; margin: 22px auto 0; max-width: 350px; }
    .bottom { position: fixed; bottom: 26px; left: 20px; right: 20px; text-align: center; color: #62635d; font: 9px/1.6 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .frame { animation: none; } }
  </style>
</head>
<body>
  <main class="frame">
    <p class="brand">Оҕо кута</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="status">Временная пауза</p>
    <h1>Сайт временно<br>недоступен</h1>
    <p class="note">Пожалуйста, загляните позже.</p>
  </main>
  <div class="bottom">Оҕо кута · Авторские обереги</div>
</body>
</html>

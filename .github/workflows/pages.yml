name: Publish Moroshka game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir -p _site/play _site/questions _site/assets
          cp index.html site.css organic.css route-v3.css landing.js map.js data.js icons.js route-engine.js question-bank.js _site/
          cp assets/siberia-river-v3.webp assets/game-table-river-v3.webp _site/assets/
          cp play/index.html play/game.js _site/play/
          cp questions/index.html questions/catalog.js _site/questions/
          touch _site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
